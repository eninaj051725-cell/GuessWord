<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="app">
        <div
            class="flex justify-center mt-10 bg-[url('https://cdn.aptoide.com/imgs/0/c/9/0c9f01016085ad3ea4c228b44d95371f_fgraphic.png')] bg-no-repeat bg-cover bg-center w-full h-screen">
            <div>
                <div>
                    <h1 class="text-white text-5xl text-center mb-5">
                        {{display.join(' ')}}

                    </h1>
                </div>
                <div v-for="(row, i) in letters" :key="i" class="flex justify-center gap-2 mb-3">
                    <div v-for="letter in row" :key="letter" @click="press(letter)"
                        :class="['border rounded-xl text-3xl cursor-pointer hover:bg-white duration-200 p-5',
                        usedLetters.includes(letter)
                        ? 'bg-orange-500 cursor-not-allowed opacity-50'
                        : 'bg-blue-300 cursor-pointer'


                        ]">
                        {{letter}}

                    </div>
                </div>
                <div class="flex justify-center">
                    <button @click="restartGame"
                        class="my-5 text-2xl font-bold bg-blue-500 px-5 py-2 rounded-lg text-gray-100 cursor-pointer hover:scale-105">Restart</button>
                </div>
                <div>
                    <h1 class="text-white font-bold text-3xl">{{message}}</h1>
                </div>
            </div>
        </div>

    </div>



    <script>
        Vue.createApp({
            data() {
                return {
                    letters: [
                        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                        ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
                        ["Z", "X", "C", "V", "B", "N", "M"],
                    ],
                    display: ["_", "_", "_", "_", "_",],
                    words: ["TIGER", "SPEED", "COLOR", "APPLE", "MELON"],
                    usedLetters: [],
                    randomValue: "",
                    message: "",
                }
            },
            methods: {
                randomWords() {
                    let random = Math.floor(Math.random() * this.words.length);
                    return this.words[random];
                },

                press(letter) {
                    if (this.usedLetters.includes(letter)) return
                    this.usedLetters.push(letter);
                    for (let i = 0; i < this.randomValue.length; i++) {
                        if (this.randomValue[i] === letter) {
                            this.display[i] = letter;
                        }
                    }
                    this.isWinner();
                },

                isWinner() {
                    if (this.display.join("") === this.randomValue) {
                        this.message = "You Win"
                    }
                },
                restartGame(){
                    this.randomValue = this.randomWords()
                    this.display = ["_","_","_","_","_"];
                    this.usedLetters = [];
                    this.message='';


                }

            },
            mounted() {
                this.randomValue = this.randomWords();
                console.log(this.randomValue);
            }

        }).mount('#app');

    </script>

</body>

</html>
